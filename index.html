<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Terminal Global</title>

<style>
body {
  margin: 0;
  background: #0b0f14;
  color: white;
  font-family: Arial;
}

.grid {
  display: grid;
  grid-template-columns: 20% 55% 25%;
  grid-template-rows: 50% 30% 20%;
  height: 100vh;
  gap: 8px;
  padding: 8px;
}

.box {
  background: #11161c;
  border-radius: 8px;
  padding: 5px;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<div class="grid">

<!-- CALENDÁRIO -->
<div class="box">
<iframe src="https://sslecal2.investing.com?importance=3&features=datepicker&countries=32,5&lang=12"></iframe>
</div>

<!-- GRÁFICO PRINCIPAL -->
<div class="box" id="principal"></div>

<!-- DASHBOARD GLOBAL -->
<div class="box">
<script src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js">
{
"colorTheme": "dark",
"tabs": [
{
"title": "Américas",
"symbols": [
{"s": "FOREXCOM:SPXUSD", "d": "S&P 500"},
{"s": "FOREXCOM:DJI", "d": "Dow Jones"},
{"s": "BMFBOVESPA:IBOV", "d": "IBOV"}
]
},
{
"title": "Europa",
"symbols": [
{"s": "INDEX:FTSE", "d": "FTSE"},
{"s": "INDEX:DAX", "d": "DAX"}
]
},
{
"title": "Ásia",
"symbols": [
{"s": "INDEX:NKY", "d": "Nikkei"},
{"s": "INDEX:HSI", "d": "Hang Seng"}
]
}
]
}
</script>
</div>

<!-- NOTÍCIAS -->
<div class="box">
<iframe src="https://www.investing.com/news/"></iframe>
</div>

<!-- MERCADOS -->
<div class="box">
<script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js">
{
"symbols": [
{"proName": "FOREXCOM:SPXUSD", "title": "US500"},
{"proName": "FOREXCOM:DJI", "title": "US30"},
{"proName": "BMFBOVESPA:IBOV", "title": "IBOV"},
{"proName": "CBOE:VIX", "title": "VIX"},
{"proName": "TVC:DXY", "title": "DXY"},
{"proName": "BINANCE:BTCUSDT", "title": "BTC"},
{"proName": "OANDA:XAUUSD", "title": "OURO"},
{"proName": "OANDA:XAGUSD", "title": "PRATA"},
{"proName": "TVC:UKOIL", "title": "BRENT"},
{"proName": "TVC:USOIL", "title": "WTI"}
],
"colorTheme": "dark"
}
</script>
</div>

<!-- JUROS -->
<div class="box">
<script src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js">
{
"symbol": "TVC:US02Y",
"colorTheme": "dark"
}
</script>

<script src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js">
{
"symbol": "TVC:US05Y",
"colorTheme": "dark"
}
</script>

<script src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js">
{
"symbol": "TVC:US10Y",
"colorTheme": "dark"
}
</script>
</div>

<!-- IA -->
<div class="box">
<iframe src="https://claude.ai"></iframe>
</div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
"container_id": "principal",
"symbol": "FX_IDC:USDBRL",
"interval": "5",
"theme": "dark",
"height": "100%"
});
</script>

</body>
</html>
